host_ip: ${HERMES_EXP_SLAVE_IP}
is_master_broker: False

remote_subscriber_ips:
  - ${HERMES_EXP_MASTER_IP}
remote_publisher_ips: []
connections: []

is_remote_kill: True
remote_kill_ip: ${HERMES_EXP_MASTER_IP}

logging_spec: {}

video_codec_config_filepath: null
audio_codec_config_filepath: null

producer_specs: []

consumer_specs: []

pipeline_specs:
  - package: "dummy"
    class: "DummyEchoPipeline"
    node_id: "echo"
    settings:
      data_out_spec:
        sampling_rate_hz: 1
        payload_num_bytes: 1
        buf_len: 1
        bundles_not_to_write:
          - "echo"
          - "echo_metadata"

      data_in_specs:
        - package: "dummy"
          class: "DummyPipeline"
          node_id: "probe"
          topics: ["probe"]
          settings:
            sampling_rate_hz: 1
            payload_num_bytes: 1
            buf_len: 1
            bundles_not_to_write:
              - "rtt"
              - "rtt_metadata"
              - "probe"
              - "probe_metadata"

    logging_spec: {}
