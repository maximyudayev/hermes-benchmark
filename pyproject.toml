[project]
name = "hermes-benchmark"
version = "0.0.1"
requires-python = ">=3.7"
authors = [
  { name="Maxim Yudayev", email="maxim.yudayev@gmail.com" },
  { name="e-Media Research Lab @ KU Leuven", email="emedia@kuleuven.be" },
]
description = "Benchmarks for the HERMES closed-loop human sensing and processing framework"
keywords = ["embedded ai", "wearables", "sensors", "streaming", "realtime processing", "physiology", "hermes"]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: System :: Distributed Computing"
]
dependencies = [
  "pysio-hermes==0.5.1",
  "matplotlib",
  "scipy",
  "pillow",
  "tqdm",
]

[tool.uv.sources]
pysio-hermes = { git = "https://github.com/maximyudayev/hermes.git" }

[project.urls]
Homepage = "https://yudayev.com/hermes"
Documentation = "https://yudayev.com/hermes"
Repository = "https://github.com/maximyudayev/hermes-benchmark.git"
Issues = "https://github.com/maximyudayev/hermes-benchmark/issues"
Changelog = "https://github.com/maximyudayev/hermes-benchmark/blob/main/CHANGELOG.md"
