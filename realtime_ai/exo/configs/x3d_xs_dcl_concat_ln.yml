# X3D-XS + DCL with concat + LayerNorm fusion (Video + IMU)

prediction_horizons: [0, 0.1, 0.2, 0.3, 0.5, 1]
window_size: 2.0

checkpoint: "../weights/x3d_xs_dcl_concat_ln.pt"

modalities:
  raw_imu:
    receptive_field: 120
    column_patterns:
      - "acc_Pelvis_*"
      - "acc_*_Upper_Leg_*"
      - "acc_*_Lower_Leg_*"
      - "acc_*_Foot_*"
      - "gyro_Pelvis_*"
      - "gyro_*_Upper_Leg_*"
      - "gyro_*_Lower_Leg_*"
      - "gyro_*_Foot_*"
    eval_transforms: []

  video:
    receptive_field: 4
    stride: 15
    eval_transforms:
      - name: "DivideBy255"
        params: {}
      - name: "NormalizeVideo"
        params:
          mean: [0.45, 0.45, 0.45]
          std: [0.225, 0.225, 0.225]
      - name: "ShortSideScale"
        params:
          size: 182
      - name: "CenterCropVideo"
        params:
          crop_size: [182, 182]

models:
  raw_imu:
    name: "DeepConvLSTM"
    params:
      channels: 42
      window_size: 120
      conv_kernels: 64
      conv_kernel_size: 11
      lstm_units: 1024
      lstm_layers: 1
      dropout: 0.5
      feature_dim: 256

  video:
    name: "X3D_Video"
    params:
      pretrained: false
      model_size: "xs"
      feature_dim: 256

  fusion:
    name: "FusionModel"
    params:
      fusion_method: "concat_layernorm"
      hidden_dim: 512
      dropout: 0.5
